# Furniture Classifier — configuration
# Update huggingface.repo_id after creating your HuggingFace model repository.

model:
  in_channels: 3
  hidden_units: 10
  num_classes: 8
  image_size: 64

# Must match the alphabetical order ImageFolder used during training.
# Uppercase names sort before lowercase in Python (Library < Table < bed < ...).
classes:
  - Library
  - Table
  - bed
  - chair
  - closet
  - dresser
  - mirror
  - sofa

training:
  batch_size: 32
  lr: 0.1
  epochs: 5
  seed: 42

huggingface:
  repo_id: "YOUR_HF_USERNAME/furniture-classifier"
  filename: "furniture_classifier.pth"
